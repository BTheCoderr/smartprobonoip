name: Audit Netlify Adapter Cleanup

on:
  push:
    branches:
      - audit/full-app-2026-09-28

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-app-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Remove pinned Netlify Next adapter and align Next ESLint config
        run: |
          npm uninstall @netlify/plugin-nextjs --save-dev
          npm install eslint-config-next@16.3.6 --save-dev --save-exact
      - name: Commit package and lockfile cleanup
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Use automatic Netlify Next adapter"
          git push origin HEAD:audit/full-app-2026-09-28
