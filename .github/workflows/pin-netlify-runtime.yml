name: Pin Current Netlify Next Runtime

on:
  push:
    branches:
      - audit/full-app-2026-09-28

permissions:
  contents: write

jobs:
  pin-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-app-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pin current Netlify Next runtime
        run: npm install --save-dev --save-exact @netlify/plugin-nextjs@5.16.0
      - name: Add explicit runtime config
        shell: bash
        run: |
          if ! grep -q '@netlify/plugin-nextjs' netlify.toml; then
            printf '\n[[plugins]]\n  package = "@netlify/plugin-nextjs"\n' >> netlify.toml
          fi
      - name: Commit runtime update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json netlify.toml
          if git diff --cached --quiet; then
            echo "No runtime changes required."
            exit 0
          fi
          git commit -m "Pin Netlify Next runtime 5.16.0"
          git push origin HEAD:audit/full-app-2026-09-28
