name: Readiness Browser Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_SECRET_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      OPENAI_API_KEY: ""
      GROQ_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium browser for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Build local application with no production credentials
        run: npm run build
      - name: Test Learn, Prepare, Connect in a browser
        run: npm run test:smoke
      - name: Retain synthetic-only failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-browser-smoke-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3
