name: Audit Dependency Upgrade

on:
  push:
    branches:
      - audit/full-app-2026-09-28

permissions:
  contents: write

jobs:
  upgrade-next:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-app-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Upgrade Next.js security patch
        run: npm install next@16.3.6 --save-exact
      - name: Commit lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Next.js is already at the requested version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 16.3.6"
          git push origin HEAD:audit/full-app-2026-09-28
