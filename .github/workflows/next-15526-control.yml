name: Next 15.5.26 Control Upgrade

on:
  push:
    branches:
      - audit/netlify-next-15526-control

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/netlify-next-15526-control
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --save-exact next@15.5.26 eslint-config-next@15.5.26
      - name: Commit only dependency downgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Test Next 15.5.26 on Netlify"
          git push origin HEAD:audit/netlify-next-15526-control
