name: One-Time Security Dependency Repair

on:
  push:
    branches:
      - agent/security-dependency-fix-20261105
    paths:
      - .github/workflows/security-dependency-repair.yml

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.repository == 'BTheCoderr/smartprobonoip' && github.ref == 'refs/heads/agent/security-dependency-fix-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile using patched same-major dependencies
        run: |
          npm install next@15.5.29 --save-exact --package-lock-only
          npm update dompurify source-map-js --package-lock-only
      - name: Verify install and existing CI checks
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:copy-safety
          npm run build
          npm audit --omit=dev --audit-level=critical
      - name: Commit only verified dependency manifests and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm -- .github/workflows/security-dependency-repair.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Patch Next.js and transitive dependency security advisories"
          git push origin HEAD:agent/security-dependency-fix-20261105
