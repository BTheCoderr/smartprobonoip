name: One-time Stage 1 repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply Stage 1 repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          professionals = root / 'src/app/for-professionals/page.tsx'
          text = professionals.read_text()
          text = text.replace('  TestimonialCard,\n', '')
          testimonial_block = '''          <div className="mt-8 grid gap-6 lg:grid-cols-2">
            <TestimonialCard
              quote="The structured export saved time on basic organization. I still reviewed everything myself — but the packet was a useful starting point."
              role="Patent agent"
              context="Professional reviewer feedback — anonymized"
            />
            <TestimonialCard
              quote="Inventors showed up with timelines, materials lists, and questions already organized. It felt like a real intake conversation instead of starting from scratch."
              role="Clinic coordinator"
              context="Rhode Island pilot feedback — anonymized"
            />
          </div>
'''
          if testimonial_block in text:
              text = text.replace(testimonial_block, '')
          professionals.write_text(text)

          tracking = root / 'src/components/PartnerTrackingInit.tsx'
          tracking.write_text('''"use client";

import { Suspense, useEffect, useRef } from "react";
import { usePathname, useSearchParams } from "next/navigation";
import { trackEvent } from "@/lib/analytics/client";
import {
  captureTrackingFromSearch,
  parseTrackingFromSearch,
} from "@/lib/partnerTracking";

const REFERRAL_EVENT_PREFIX = "smartprobonoip:partner-referral-clicked:";

function PartnerTrackingCapture() {
  const pathname = usePathname();
  const searchParams = useSearchParams();
  const firedRef = useRef<Set<string>>(new Set());

  useEffect(() => {
    const query = searchParams.toString();
    if (!query) return;

    const search = `?${query}`;
    const incoming = parseTrackingFromSearch(search);
    captureTrackingFromSearch(search);
    if (!incoming) return;

    const signature = [
      incoming.partnerSlug ?? "",
      incoming.source ?? "",
      incoming.campaign ?? "",
    ].join("|");
    if (!signature.replaceAll("|", "") || firedRef.current.has(signature)) return;

    const storageKey = `${REFERRAL_EVENT_PREFIX}${signature}`;
    try {
      if (window.sessionStorage.getItem(storageKey)) return;
      window.sessionStorage.setItem(storageKey, "1");
    } catch {
      // In-memory dedupe below still prevents duplicate firing in this mount.
    }

    firedRef.current.add(signature);
    trackEvent("partner_referral_link_clicked", {
      route: pathname,
      metadata: {
        partner: incoming.partnerSlug,
        source: incoming.source,
        campaign: incoming.campaign,
        pageSection: "referral_landing",
      },
    });
  }, [pathname, searchParams]);

  return null;
}

export function PartnerTrackingInit() {
  return (
    <Suspense fallback={null}>
      <PartnerTrackingCapture />
    </Suspense>
  );
}
''')

          events = root / 'src/lib/analytics/events.ts'
          text = events.read_text()
          if '"partner_referral_link_clicked"' not in text:
              text = text.replace(
                  '  "partner_interest_clicked",\n',
                  '  "partner_interest_clicked",\n  "partner_referral_link_clicked",\n',
              )
          events.write_text(text)

          gtm = root / 'src/lib/analytics/gtm.ts'
          text = gtm.read_text()
          if 'partner_referral_link_clicked:' not in text:
              text = text.replace(
                  '  partner_interest_clicked: "partner_interest_clicked",\n',
                  '  partner_interest_clicked: "partner_interest_clicked",\n  partner_referral_link_clicked: "partner_referral_link_clicked",\n',
              )
          gtm.write_text(text)

          allowed_suffixes = {
              '.ts', '.tsx', '.js', '.jsx', '.md', '.mdx', '.json', '.html',
              '.txt', '.yml', '.yaml', '.toml', '.css', '.scss'
          }
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              if path.suffix not in allowed_suffixes and path.name != '.env.example':
                  continue
              try:
                  original = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = original.replace(
                  'privacy@smartprobonoip.org',
                  'bferrell@smartprobono.org',
              ).replace(
                  'smartprobonoip.org',
                  'smartprobono.org',
              )
              if updated != original:
                  path.write_text(updated)
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit repaired files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "SmartProBonoIP Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src public
          git commit -m "Stage 1 pre-outreach repair"
          git push origin main
