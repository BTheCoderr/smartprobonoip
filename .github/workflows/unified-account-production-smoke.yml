name: Unified Account Production Smoke

on:
  push:
    branches:
      - audit/unified-account-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live account and Legal routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          for route in / /sign-in /workspace /legal /legal/document /legal/ri/eviction /ip; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$base$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

      - name: Signed-out account boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          matters=$(curl -sS -o /tmp/matters -w "%{http_code}" "$base/api/legal/matters")
          claim=$(curl -sS -o /tmp/claim -w "%{http_code}" -X POST "$base/api/account/claim-session")
          echo "legal/matters -> $matters"
          echo "account/claim-session -> $claim"
          test "$matters" = "401"
          test "$claim" = "401"

      - name: Anonymous IP portfolio remains functional
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'x-pilot-session: account-prod-smoke-20260929'             https://smartprobono.org/api/portfolio)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "portfolio -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.snapshot.inventions | type=="array"' >/dev/null

      - name: Existing Legal API remains functional
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"messages":[{"role":"user","content":"Give me a short preparation checklist only. Do not give legal advice."}]}'             https://smartprobono.org/api/legal/chat)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "legal/chat -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.message | type=="string" and length > 20' >/dev/null

      - name: Auth callback rejects missing code safely
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://smartprobono.org/api/auth/callback)
          echo "auth callback without code -> $code"
          case "$code" in 301|302|303|307|308) ;; *) exit 1 ;; esac
