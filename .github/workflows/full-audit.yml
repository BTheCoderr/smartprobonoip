name: Full App Audit

on:
  push:
    branches:
      - audit/full-app-2026-09-28

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Copy safety
        run: npm run test:copy-safety
      - name: Production build
        run: npm run build
      - name: Local runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/smartprobono-next.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/legal >/dev/null; then break; fi
            sleep 1
          done

          chat=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"messages":[{"role":"user","content":"I received a generic notice. Give me a preparation checklist only."}]}'             http://127.0.0.1:3000/api/legal/chat)
          chat_code=$(echo "$chat" | tail -n1)
          chat_body=$(echo "$chat" | sed '$d')
          echo "local legal/chat -> $chat_code"
          test "$chat_code" = "200"
          echo "$chat_body" | jq -e '.message | type=="string" and length > 40' >/dev/null

          draft=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"documentType":"Factual summary","jurisdiction":"Not specified","facts":"I received a written notice on September 1. I have a copy of it. I have not verified any deadlines.","goal":"Create a neutral factual summary I can bring to a professional.","tone":"Professional and factual"}'             http://127.0.0.1:3000/api/legal/draft)
          draft_code=$(echo "$draft" | tail -n1)
          draft_body=$(echo "$draft" | sed '$d')
          echo "local legal/draft -> $draft_code"
          test "$draft_code" = "200"
          echo "$draft_body" | jq -e '.draft | startswith("DRAFT — FOR REVIEW")' >/dev/null

          session="audit-smoke-20260928-0001"
          generated=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -H "x-pilot-session: $session"             -d '{"answers":{"whatCreated":"A portable bottle that filters water while a hiker drinks.","problemSolved":"Hikers can run out of safe drinking water and existing treatment gear can be cumbersome.","whoFor":"Hikers and campers who need portable clean water.","howItWorks":"Water passes through a replaceable filter cartridge as the user drinks through the mouthpiece.","mainParts":"Bottle body, replaceable filter cartridge, intake valve, cap, and mouthpiece.","whatDifferent":"The replaceable cartridge filters inline while drinking without a separate pumping step.","itemType":"physical_product","assets":["notes"],"sharedChannels":["none"],"goals":["expert_review"],"location":"United States"}}'             http://127.0.0.1:3000/api/generate)
          generate_code=$(echo "$generated" | tail -n1)
          generate_body=$(echo "$generated" | sed '$d')
          echo "local api/generate -> $generate_code"
          test "$generate_code" = "200"
          echo "$generate_body" | jq -e '.profile.ideaSummary | type=="string" and length > 20' >/dev/null
      - name: Dependency audit
        if: always()
        run: npm audit --json || true

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Public route smoke test
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          routes=(
            "/"
            "/legal"
            "/legal/ask-ermi"
            "/legal/draft"
            "/legal/record-clearing"
            "/ip"
            "/sample"
            "/learn"
            "/trust"
            "/for-professionals"
            "/pilot"
            "/workspace"
            "/organization/login"
            "/privacy"
            "/terms"
            "/contact"
            "/about"
            "/after-meeting"
          )
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$base$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

      - name: Historical and protection redirects
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          for route in "/smartprobonoip" "/protect"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$base$route")
            location=$(curl -sSI "$base$route" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2; exit}')
            echo "$route -> $code location=$location"
            case "$code" in 301|302|303|307|308) ;; *) exit 1 ;; esac
          done

      - name: Security headers
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -sSI https://smartprobono.org/ | tr -d '\r')
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          echo "$headers" | grep -qi '^content-security-policy-report-only:'

      - name: API authorization boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          check_rejected () {
            route="$1"
            code=$(curl -sS -o /tmp/body -w "%{http_code}" "$base$route")
            echo "$route -> $code $(head -c 200 /tmp/body)"
            case "$code" in 401|403|405) ;; *) exit 1 ;; esac
          }
          check_rejected "/api/records"
          check_rejected "/api/partner/metrics"

      - name: Ermi production POST
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"messages":[{"role":"user","content":"I received a generic notice. Give me a short checklist of facts to gather before I contact a qualified professional. Do not give legal advice."}]}'             https://smartprobono.org/api/legal/chat)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "legal/chat -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.message | type=="string" and length > 40' >/dev/null

      - name: Legal draft production POST
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"documentType":"Factual summary","jurisdiction":"Not specified","facts":"On September 1 I received a written notice. I have a copy of it. I have not verified any deadlines.","goal":"Create a neutral factual summary I can bring to a professional.","tone":"Professional and factual"}'             https://smartprobono.org/api/legal/draft)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "legal/draft -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.draft | type=="string" and length > 60' >/dev/null

      - name: IP generator production POST
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          session="audit-smoke-20260928-0002"
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -H "x-pilot-session: $session"             -d '{"answers":{"whatCreated":"A portable bottle that filters water while a hiker drinks.","problemSolved":"Hikers can run out of safe drinking water and existing treatment gear can be cumbersome.","whoFor":"Hikers and campers who need portable clean water.","howItWorks":"Water passes through a replaceable filter cartridge as the user drinks through the mouthpiece.","mainParts":"Bottle body, replaceable filter cartridge, intake valve, cap, and mouthpiece.","whatDifferent":"The replaceable cartridge filters inline while drinking without a separate pumping step.","itemType":"physical_product","assets":["notes"],"sharedChannels":["none"],"goals":["expert_review"],"location":"United States"}}'             https://smartprobono.org/api/generate)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "api/generate -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.profile.ideaSummary | type=="string" and length > 20' >/dev/null
