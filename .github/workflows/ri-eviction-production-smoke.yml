name: RI Eviction Production Smoke

on:
  push:
    branches:
      - audit/ri-eviction-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live SmartProBono routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          routes=(
            "/legal"
            "/legal/document"
            "/legal/ask-ermi"
            "/legal/ri/eviction"
            "/legal/ri/eviction/intake"
            "/legal/ri/eviction/results"
            "/legal/ri/eviction/summary"
          )
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /tmp/body -w "%{http_code}" "$base$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

      - name: Legal API regression
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"messages":[{"role":"user","content":"Give me a preparation checklist only. Do not give legal advice."}]}'             https://smartprobono.org/api/legal/chat)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "legal/chat -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.message | type=="string" and length > 30' >/dev/null
