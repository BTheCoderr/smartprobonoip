name: Hardened DB Production Smoke

on:
  push:
    branches:
      - feature/unified-account-workspace

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Public routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://smartprobono.org"
          for route in / /legal /legal/document /legal/ri/eviction /ip /workspace; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$base$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

      - name: Existing IP server path after privilege hardening
        shell: bash
        run: |
          set -euo pipefail
          session="db-hardening-smoke-20260929"
          response=$(curl -sS -w '\n%{http_code}'             -H "x-pilot-session: $session"             https://smartprobono.org/api/portfolio)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "portfolio -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.inventions | type=="array"' >/dev/null

      - name: Existing Legal API
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}'             -H 'Content-Type: application/json'             -d '{"messages":[{"role":"user","content":"Give me a preparation checklist only. Do not give legal advice."}]}'             https://smartprobono.org/api/legal/chat)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "legal/chat -> $code"
          test "$code" = "200"
          echo "$body" | jq -e '.message | type=="string" and length > 20' >/dev/null

      - name: New account APIs are closed before deploy
        shell: bash
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" https://smartprobono.org/api/legal/matters)
          echo "current production legal/matters -> $code"
          test "$code" = "404"
