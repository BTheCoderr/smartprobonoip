name: Netlify Build Repro

on:
  push:
    branches:
      - audit/full-app-2026-09-28

jobs:
  netlify-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_SITE_ID: smartprobonoip.netlify.app
      CONTEXT: deploy-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Netlify deploy-preview build
        run: DEBUG=* npx --yes netlify-cli@latest build --context deploy-preview
