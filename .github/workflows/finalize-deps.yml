name: Finalize Netlify-Compatible Dependencies

on:
  push:
    branches:
      - audit/full-app-2026-09-28

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-app-2026-09-28
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use flat-config linter and patched PostCSS
        shell: bash
        run: |
          npm install --save-dev --save-exact eslint-config-next@16.3.6
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.overrides = { ...(pkg.overrides || {}), "postcss": "8.5.23" };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only
          npm ci
          npm run lint
          npm test
          npm run test:copy-safety
          npm run build
          npm audit --omit=dev --audit-level=critical
      - name: Commit final dependency set
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
            exit 0
          fi
          git commit -m "Finalize Netlify-compatible dependency set"
          git push origin HEAD:audit/full-app-2026-09-28
